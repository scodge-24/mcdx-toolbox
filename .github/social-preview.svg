<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">mcdx-toolbox — Mathcad worksheets, agent-ready</title>
  <desc id="desc">Inspect, author, validate and visually review worksheets. An illustrative synthetic rectangle worksheet sits beside a YAML authoring example. Optional local Mathcad Prime rendering.</desc>
  <rect width="1280" height="640" fill="#101c30"/>
  <path d="M0 584H1280M720 0V584" stroke="#23344d" stroke-width="2"/>
  <rect x="56" y="54" width="40" height="6" rx="3" fill="#57dfb2"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="56" y="120" fill="#ffffff" font-size="48" font-weight="700">mcdx-toolbox</text>
    <text x="56" y="171" fill="#c1cfe2" font-size="26">Mathcad worksheets, agent-ready.</text>
    <text x="56" y="225" fill="#57dfb2" font-size="20">Python / CLI / MCP / Claude plugin</text>
    <rect x="56" y="263" width="603" height="169" rx="12" fill="#192b43" stroke="#304660"/>
    <text x="78" y="299" fill="#8fa6c3" font-size="14" letter-spacing="2">SEMANTIC YAML</text>
    <g font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#e3edf9">
      <text x="78" y="337">- kind: math</text>
      <text x="102" y="370">expression: "width = 3 * mm"</text>
      <text x="78" y="403"># author intent, then inspect output</text>
    </g>
    <text x="56" y="485" fill="#ffffff" font-size="22">Inspect → Author → Validate → Review</text>
    <text x="56" y="528" fill="#9db1cb" font-size="18">Optional real rendering with local Mathcad Prime</text>
    <rect x="787" y="47" width="394" height="504" rx="8" fill="#07111f" opacity="0.4"/>
    <rect x="778" y="38" width="394" height="504" rx="8" fill="#f8fafc"/>
    <rect x="808" y="69" width="58" height="5" fill="#147d6a"/>
    <text x="808" y="105" fill="#526276" font-size="13" letter-spacing="1.3">SYNTHETIC WORKSHEET</text>
    <text x="808" y="149" fill="#172b43" font-size="23" font-weight="700">A simple rectangle</text>
    <path d="M808 172H1140" stroke="#d4dce6"/>
    <g fill="#223d58" font-family="DejaVu Serif, serif" font-size="25">
      <text x="817" y="222">width := 3 mm</text>
      <text x="817" y="272">height := 4 mm</text>
      <text x="817" y="322">area := width · height</text>
    </g>
    <rect x="815" y="352" width="108" height="144" fill="#dcefe9" stroke="#147d6a" stroke-width="2"/>
    <text x="946" y="405" fill="#172b43" font-size="21">Area: 12 mm²</text>
    <text x="808" y="515" fill="#64748b" font-size="12">Illustration · not a Prime render</text>
    <text x="56" y="616" fill="#9db1cb" font-size="17">Open source · MIT</text>
    <text x="774" y="616" fill="#9db1cb" font-size="17">Inspect. Create. Visually verify.</text>
  </g>
</svg>
